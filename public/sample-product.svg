<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="示例场景：北欧客厅餐桌">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3eee6"/>
      <stop offset="100%" stop-color="#e8dfd2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d2b48c"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c9a0"/>
      <stop offset="55%" stop-color="#c9a87a"/>
      <stop offset="100%" stop-color="#a88458"/>
    </linearGradient>
    <linearGradient id="light" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff8e7" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6b5438" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- room wall -->
  <rect width="800" height="520" fill="url(#wall)"/>
  <!-- floor -->
  <rect y="520" width="800" height="280" fill="url(#floor)"/>
  <!-- floorboards -->
  <g stroke="#9a7a52" stroke-width="1" opacity="0.25">
    <line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="610" x2="800" y2="610"/>
    <line x1="0" y1="660" x2="800" y2="660"/>
    <line x1="0" y1="710" x2="800" y2="710"/>
    <line x1="0" y1="760" x2="800" y2="760"/>
  </g>

  <!-- window frame -->
  <rect x="480" y="80" width="240" height="280" rx="4" fill="#f8fafc" stroke="#c4b5a0" stroke-width="10"/>
  <rect x="496" y="96" width="208" height="248" fill="url(#window)"/>
  <line x1="600" y1="96" x2="600" y2="344" stroke="#e2e8f0" stroke-width="6"/>
  <line x1="496" y1="220" x2="704" y2="220" stroke="#e2e8f0" stroke-width="6"/>
  <!-- window light wash -->
  <polygon points="496,344 704,344 760,520 420,520" fill="url(#light)"/>

  <!-- plant left -->
  <g transform="translate(110,390)">
    <ellipse cx="0" cy="90" rx="36" ry="10" fill="#8a7355" opacity="0.25"/>
    <rect x="-22" y="40" width="44" height="50" rx="6" fill="#8b6f55"/>
    <ellipse cx="-18" cy="10" rx="22" ry="28" fill="#5f8f6a"/>
    <ellipse cx="16" cy="0" rx="20" ry="26" fill="#6fa07a"/>
    <ellipse cx="0" cy="-18" rx="18" ry="22" fill="#4e7d5c"/>
  </g>

  <!-- chair back left -->
  <g transform="translate(200,430)" opacity="0.9">
    <rect x="0" y="0" width="70" height="12" rx="4" fill="#b08960"/>
    <rect x="8" y="12" width="10" height="90" rx="2" fill="#a07a52"/>
    <rect x="52" y="12" width="10" height="90" rx="2" fill="#a07a52"/>
    <rect x="4" y="70" width="62" height="10" rx="2" fill="#c4a174"/>
  </g>

  <!-- dining table (hero, large in room) -->
  <g filter="url(#soft)">
    <rect x="230" y="450" width="26" height="150" rx="4" fill="url(#wood)"/>
    <rect x="544" y="450" width="26" height="150" rx="4" fill="url(#wood)"/>
    <rect x="270" y="450" width="20" height="140" rx="3" fill="#b8956a" opacity="0.9"/>
    <rect x="510" y="450" width="20" height="140" rx="3" fill="#b8956a" opacity="0.9"/>
    <rect x="220" y="420" width="360" height="34" rx="6" fill="#b08960"/>
    <ellipse cx="400" cy="410" rx="240" ry="58" fill="url(#wood)"/>
    <ellipse cx="400" cy="400" rx="228" ry="48" fill="#f0e2c8" opacity="0.5"/>
    <path d="M200 410 Q400 360 600 410" fill="none" stroke="#8f7048" stroke-width="2" opacity="0.22"/>
  </g>

  <!-- tabletop styling: vase + books -->
  <g transform="translate(400,330)">
    <ellipse cx="0" cy="55" rx="20" ry="6" fill="#c4b19a" opacity="0.35"/>
    <path d="M-12 48 L-8 -4 Q0 -22 8 -4 L12 48 Z" fill="#8fa89a"/>
    <ellipse cx="0" cy="-6" rx="10" ry="7" fill="#7d9688"/>
    <circle cx="-5" cy="-22" r="6" fill="#d97676"/>
    <circle cx="7" cy="-26" r="5" fill="#e8a0a0"/>
    <circle cx="1" cy="-34" r="4.5" fill="#c45c5c"/>
  </g>
  <g transform="translate(500,388)">
    <rect x="0" y="0" width="54" height="8" rx="1" fill="#7c8aa0"/>
    <rect x="4" y="-8" width="48" height="8" rx="1" fill="#c97878"/>
  </g>

  <!-- sideboard hint right -->
  <rect x="680" y="470" width="90" height="110" rx="4" fill="#c4a174" opacity="0.55"/>
  <rect x="688" y="478" width="74" height="6" rx="1" fill="#efe2cc" opacity="0.6"/>
</svg>
