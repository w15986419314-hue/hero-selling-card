<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="示例商品：北欧实木餐桌">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f5f0"/>
      <stop offset="100%" stop-color="#ebe4d8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="55%" stop-color="#c4a174"/>
      <stop offset="100%" stop-color="#a88458"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5b5"/>
      <stop offset="100%" stop-color="#c9a87a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8a7355" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- floor shadow -->
  <ellipse cx="400" cy="620" rx="220" ry="28" fill="#cbb89a" opacity="0.35"/>
  <!-- table group -->
  <g filter="url(#soft)">
    <!-- legs -->
    <rect x="210" y="430" width="28" height="170" rx="4" fill="url(#wood)"/>
    <rect x="562" y="430" width="28" height="170" rx="4" fill="url(#wood)"/>
    <rect x="250" y="430" width="22" height="160" rx="3" fill="#b8956a" opacity="0.85"/>
    <rect x="528" y="430" width="22" height="160" rx="3" fill="#b8956a" opacity="0.85"/>
    <!-- apron -->
    <rect x="200" y="400" width="400" height="36" rx="6" fill="#b08960"/>
    <!-- tabletop -->
    <ellipse cx="400" cy="390" rx="260" ry="70" fill="url(#top)"/>
    <ellipse cx="400" cy="378" rx="250" ry="58" fill="#f0e2c8" opacity="0.55"/>
    <!-- wood grain hint -->
    <path d="M180 390 Q400 330 620 390" fill="none" stroke="#a88458" stroke-width="2" opacity="0.25"/>
    <path d="M200 405 Q400 355 600 405" fill="none" stroke="#8f7048" stroke-width="1.5" opacity="0.2"/>
  </g>
  <!-- small vase accent -->
  <g transform="translate(400,300)">
    <ellipse cx="0" cy="48" rx="18" ry="6" fill="#c4b19a" opacity="0.4"/>
    <path d="M-14 40 L-10 -8 Q0 -28 10 -8 L14 40 Z" fill="#8fa89a"/>
    <ellipse cx="0" cy="-10" rx="12" ry="8" fill="#7d9688"/>
    <circle cx="-6" cy="-28" r="7" fill="#d97676" opacity="0.9"/>
    <circle cx="8" cy="-32" r="6" fill="#e8a0a0" opacity="0.85"/>
    <circle cx="2" cy="-40" r="5" fill="#c45c5c" opacity="0.8"/>
  </g>
</svg>
